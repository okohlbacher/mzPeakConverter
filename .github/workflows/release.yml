# Release archives for every platform, plus the Homebrew cask that serves the macOS ones.
#
#   macOS    aarch64 native + x86_64 cross-compiled, both on the arm64 runner    .tar.gz
#   Linux    x86_64 + aarch64, each native, inside manylinux_2_28 (glibc 2.28)  .tar.gz
#   Windows  x86_64 + aarch64, each native (windows-latest / windows-11-arm)     .zip + .NET glue
#
# A `v*` tag builds and publishes. `workflow_dispatch` rebuilds an existing tag — `only` limits it to
# some platforms, so a release cut before a platform existed can be backfilled without rebuilding
# (and re-hashing) the archives already published. A pull request that touches this file runs the
# whole matrix as a DRY RUN: built, verified, kept as workflow artifacts, nothing published — so a
# broken release job is found before a tag needs it.
#
# Beside the archives each release carries a CycloneDX SBOM generated from Cargo.lock by
# tools/gen_sbom.py, and every archive ships THIRD-PARTY-NOTICES.md, which holds the Apache-2.0 text.
#
# No Rust cache here: a tag builds once, and the six ~570 MB caches the first dry run saved pushed
# the repository past GitHub's 10 GB Actions-cache limit, evicting CI's own. Cold builds take 6-13 min.
#
# Linux builds in manylinux_2_28, not on the Ubuntu image: a binary linked against Ubuntu 22.04's
# glibc 2.35 does not start on RHEL/Rocky/Alma 8 or 9, which is what HPC clusters run. Static musl is
# not an option either — the Thermo reader dlopens the glibc-built .NET host, and BAF its vendor .so.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.11.5)"
        required: true
        type: string
      only:
        description: "Platforms, comma separated: macos,linux,windows (blank = all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and verify only: attach nothing, leave the tap alone"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # CI does not run on tags: a tagged commit was tested when it reached main, and those check runs sit
  # on its SHA. Nothing is built until all three passed. windows.yml used to cancel a push's run when the
  # next push landed, which is how v0.10.0, v0.10.1 and v0.11.3 were released untested on Windows.
  ci:
    name: CI passed on the commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for build-test (ubuntu-latest, macos-latest) and windows to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)      ref="$PR_HEAD" ;;  # the dry run waits on the pull request's own CI
            workflow_dispatch) ref="refs/tags/$TAG" ;;
            *)                 ref="$GITHUB_SHA" ;;
          esac
          # Both workflows take a dispatch on any ref, and the check runs a dispatch creates count here
          # like a push's: the remedy for a commit CI never ran on, and for one past GitHub's 30-day
          # re-run window.
          on="${GITHUB_HEAD_REF:-$TAG}"
          remedy="run \`gh workflow run ci.yml --ref $on\` and \`gh workflow run windows.yml --ref $on\`, then re-run this workflow once both have passed"
          start=$(date +%s)
          deadline=$(( start + 90 * 60 ))
          sha="" pending="the commits API" refused=0
          while :; do
            if [ -z "$sha" ]; then
              # The commits API peels an annotated tag to its commit and refuses a ref that names none;
              # check-runs answers a tag object's own SHA with 422, which this loop would wait out.
              call="commits/$ref" filter='[.sha, .commit.committer.date] | @tsv'
            else
              # The newest run of each job counts, so re-running a cancelled one clears the way. The API
              # lists newest first and a release commit carries ~15 check runs, so one page is plenty.
              # `$want` is jq's variable, not the shell's.
              # shellcheck disable=SC2016
              call="commits/$sha/check-runs?filter=all&per_page=100" filter='.total_count, (
                ["build-test (ubuntu-latest)", "build-test (macos-latest)", "windows"][] as $want
                | ([.check_runs[] | select(.name == $want)] | max_by(.id)) // {status: "not started"}
                | [$want, .status, .conclusion // ""] | @tsv)'
            fi
            if out="$(gh api "repos/$GITHUB_REPOSITORY/$call" --jq "$filter" 2> "$RUNNER_TEMP/gh-api.err")"; then
              refused=0
              if [ -z "$sha" ]; then
                IFS=$'\t' read -r sha committed <<< "$out"
                committed_at="$(date -d "$committed" +%s)"
                echo "gating on $sha, committed $committed"
                continue
              fi
              pending=""
              while IFS=$'\t' read -r name status conclusion; do
                if [ "$status" != completed ]; then
                  pending+="$name ($status); "
                elif [ "$conclusion" != success ]; then
                  echo "::error::'$name' concluded '$conclusion' on $sha — nothing is released from a commit whose CI did not pass. Re-run that job, or $remedy."
                  exit 1
                fi
              done <<< "${out#*$'\n'}"
              [ -n "$pending" ] || { echo "build-test (ubuntu-latest), build-test (macos-latest) and windows passed"; exit 0; }
              # A commit CI never ran on gets no check runs later (one pushed together with a later
              # commit, as v0.7.3 and v0.4.12 were, or a [skip ci] one), so do not wait 90 minutes for
              # it. Ten minutes lets a slow queue start; the age keeps a commit just pushed waiting.
              now=$(date +%s)
              if [ "${out%%$'\n'*}" = 0 ] && [ $(( now - start )) -ge 600 ] && [ $(( now - committed_at )) -ge 10800 ]; then
                echo "::error::$sha (committed $committed) has no check runs at all: CI never ran on it, so there is nothing to wait for. To release it, $remedy."
                exit 1
              fi
              echo "waiting on ${pending%; }"
            else
              cat "$RUNNER_TEMP/gh-api.err" >&2
              # An HTTP 4xx three times running is GitHub's answer, not an outage: a ref that names no
              # commit, or a token without checks: read. A 5xx or a dropped connection is retried.
              if grep -q 'HTTP 4[0-9][0-9]' "$RUNNER_TEMP/gh-api.err"; then refused=$(( refused + 1 )); else refused=0; fi
              if [ "$refused" -ge 3 ]; then
                echo "::error::GitHub refused repos/$GITHUB_REPOSITORY/$call three times running ($(grep -o 'HTTP 4[0-9][0-9]' "$RUNNER_TEMP/gh-api.err" | tail -1)) — nothing is released from a commit whose CI cannot be read"
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::still waiting after 90 min on ${pending%; } for ${sha:-$ref}. If those checks will never finish, $remedy."
              exit 1
            fi
            sleep 60
          done

  macos:
    name: macOS ${{ matrix.arch }}
    needs: ci
    if: ${{ !inputs.only || contains(inputs.only, 'macos') }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    env:
      # One floor for both architectures, so the cask's `depends_on macos:` is the truth.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: The tag and the crate version must agree
        run: |
          set -euo pipefail
          have="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "${TAG#v}" != "$have" ]; then
            echo "::error::tag $TAG carries version ${TAG#v} but Cargo.toml says $have — the assets would be published under a version the binary does not report"
            exit 1
          fi
          echo "VERSION=$have" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage" dist="$RUNNER_TEMP/dist"
          mkdir -p "$stage" "$dist"
          cp "target/${{ matrix.target }}/release/mzpeak-convert" "$stage/"
          strip -x "$stage/mzpeak-convert"
          # strip invalidates the linker's signature, and an arm64 binary must carry one to run at
          # all — re-sign ad-hoc. Replace with a Developer ID signature plus `xcrun notarytool submit
          # --wait` once Apple credentials are configured; the cask can then drop its quarantine
          # stanza. Notarization requires --options runtime, whose library validation would break
          # the Thermo reader (it dlopens Microsoft's libhostfxr, a different Team ID): sign with an
          # entitlements plist granting com.apple.security.cs.disable-library-validation, .allow-jit
          # and .allow-unsigned-executable-memory, or that path dies only on signed builds.
          codesign --force --sign - "$stage/mzpeak-convert"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$stage/"
          tarball="mzpeak-convert-$VERSION-${{ matrix.target }}.tar.gz"
          ( cd "$stage" && COPYFILE_DISABLE=1 tar --no-xattrs -czf "$dist/$tarball" mzpeak-convert LICENSE README.md THIRD-PARTY-NOTICES.md )
          # Hash from inside the directory so the sidecar names the bare file with shasum's own
          # two-space separator — `shasum -c` rejects anything else.
          ( cd "$dist" && shasum -a 256 "$tarball" > "$tarball.sha256" )
          { echo "### ${{ matrix.target }}"; echo '```'; cat "$dist/$tarball.sha256"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/stage/mzpeak-convert"
          file "$bin"
          # Asserted, not just printed: the x86_64 slice never runs here, so this is what keeps an arm64
          # build from shipping under the x86_64 name, or back.
          archs="$(lipo -archs "$bin")"
          [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error::$bin holds '$archs', expected ${{ matrix.arch }}"; exit 1; }
          codesign -dvv "$bin" 2>&1 | grep -E "Signature|flags"
          ( cd "$RUNNER_TEMP/dist" && shasum -a 256 -c ./*.sha256 )
          # The licenses travel with the binary: the notices hold the Apache-2.0 text and NOTICE.
          tar -tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -x THIRD-PARTY-NOTICES.md > /dev/null || { echo "::error::the archive lacks THIRD-PARTY-NOTICES.md"; exit 1; }
          # Only the native slice can be executed on this runner.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            have="$("$bin" --version)"
            [ "$have" = "mzpeak-convert $VERSION" ] || { echo "::error::--version says '$have', expected mzpeak-convert $VERSION"; exit 1; }
            "$bin" tests/fixtures/tiny.pwiz.1.1.mzML -o "$RUNNER_TEMP/smoke.mzpeak" --force
            # Read the archive back, so one that is written but unreadable fails here: the inspection
            # report and the mzML export must both hold every spectrum of the source.
            n="$(grep -o '<spectrumList count="[0-9]*"' tests/fixtures/tiny.pwiz.1.1.mzML | tr -dc 0-9)"
            report="$("$bin" "$RUNNER_TEMP/smoke.mzpeak")"
            grep -Eqx "spectra: +$n" <<< "$report" || { echo "::error::inspecting smoke.mzpeak does not count $n spectra"; echo "$report"; exit 1; }
            "$bin" "$RUNNER_TEMP/smoke.mzpeak" -o "$RUNNER_TEMP/smoke.mzML" --force
            m="$(grep -c '<spectrum ' "$RUNNER_TEMP/smoke.mzML" || true)"
            [ "$m" = "$n" ] || { echo "::error::smoke.mzML holds $m spectra, the source $n"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux ${{ matrix.arch }}
    needs: ci
    if: ${{ !inputs.only || contains(inputs.only, 'linux') }}
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, arch: x86_64, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: The tag and the crate version must agree
        shell: bash
        run: |
          set -euo pipefail
          have="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "${TAG#v}" != "$have" ]; then
            echo "::error::tag $TAG carries version ${TAG#v} but Cargo.toml says $have — the assets would be published under a version the binary does not report"
            exit 1
          fi
          echo "VERSION=$have" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage" dist="$RUNNER_TEMP/dist"
          mkdir -p "$stage" "$dist"
          cp target/release/mzpeak-convert LICENSE README.md THIRD-PARTY-NOTICES.md "$stage/"
          strip "$stage/mzpeak-convert"
          tarball="mzpeak-convert-$VERSION-${{ matrix.target }}.tar.gz"
          tar -C "$stage" -czf "$dist/$tarball" mzpeak-convert LICENSE README.md THIRD-PARTY-NOTICES.md
          ( cd "$dist" && sha256sum "$tarball" > "$tarball.sha256" )
          { echo "### ${{ matrix.target }}"; echo '```'; cat "$dist/$tarball.sha256"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/stage/mzpeak-convert"
          file "$bin" 2>/dev/null || true
          # The glibc floor is the whole reason for the container: a symbol version above 2.28 means
          # something pulled in a newer libc and the binary will not start on RHEL/Rocky 8.
          floor="$(grep -ao 'GLIBC_2\.[0-9]*' "$bin" | sort -uV | tail -1)"
          echo "highest glibc symbol version required: $floor"
          [ "$(printf '%s\n' "$floor" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ] \
            || { echo "::error::binary requires $floor, above the manylinux_2_28 floor"; exit 1; }
          ( cd "$RUNNER_TEMP/dist" && sha256sum -c ./*.sha256 )
          # The licenses travel with the binary: the notices hold the Apache-2.0 text and NOTICE.
          tar -tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -x THIRD-PARTY-NOTICES.md > /dev/null || { echo "::error::the archive lacks THIRD-PARTY-NOTICES.md"; exit 1; }
          have="$("$bin" --version)"
          [ "$have" = "mzpeak-convert $VERSION" ] || { echo "::error::--version says '$have', expected mzpeak-convert $VERSION"; exit 1; }
          "$bin" tests/fixtures/tiny.pwiz.1.1.mzML -o "$RUNNER_TEMP/smoke.mzpeak" --force
          # Read the archive back, so one that is written but unreadable fails here: the inspection
          # report and the mzML export must both hold every spectrum of the source.
          n="$(grep -o '<spectrumList count="[0-9]*"' tests/fixtures/tiny.pwiz.1.1.mzML | tr -dc 0-9)"
          report="$("$bin" "$RUNNER_TEMP/smoke.mzpeak")"
          grep -Eqx "spectra: +$n" <<< "$report" || { echo "::error::inspecting smoke.mzpeak does not count $n spectra"; echo "$report"; exit 1; }
          "$bin" "$RUNNER_TEMP/smoke.mzpeak" -o "$RUNNER_TEMP/smoke.mzML" --force
          m="$(grep -c '<spectrum ' "$RUNNER_TEMP/smoke.mzML" || true)"
          [ "$m" = "$n" ] || { echo "::error::smoke.mzML holds $m spectra, the source $n"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows ${{ matrix.arch }}
    needs: ci
    if: ${{ !inputs.only || contains(inputs.only, 'windows') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x86_64, runner: windows-latest, machine: 0x8664 }
          - { target: aarch64-pc-windows-msvc, arch: aarch64, runner: windows-11-arm, machine: 0xAA64 }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # nethost's build script downloads the loader from NuGet over rustls, and ring assembles its
      # aarch64 sources with clang, which the MSVC toolchain alone does not provide.
      - name: clang for ring (arm64)
        if: matrix.arch == 'aarch64'
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) { clang --version; exit 0 }
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { Write-Output "::warning::no clang and no choco on this image"; exit 0 }
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: The tag and the crate version must agree
        run: |
          $have = ((Get-Content Cargo.toml | Select-String '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          $want = $env:TAG -replace '^v', ''
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request' -and $want -ne $have) {
            Write-Output "::error::tag $env:TAG carries version $want but Cargo.toml says $have — the assets would be published under a version the binary does not report"
            exit 1
          }
          "VERSION=$have" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked

      # Reflection-only glue: builds without the vendor DLLs, and is architecture-neutral managed
      # code (the Agilent host is an x64 net48 exe, which Windows 11 on ARM runs under emulation).
      - name: Build the .NET glue
        run: |
          foreach ($p in 'glue/sciex/SciexGlue.csproj', 'glue/shimadzu/ShimadzuGlue.csproj',
                         'glue/agilent/AgilentGlue.csproj', 'glue/agilent_midac/AgilentMidacGlue.csproj') {
            dotnet build $p -c Release
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::dotnet build $p failed"; exit 1 }
          }

      - name: Package
        run: |
          $name  = "mzpeak-convert-$env:VERSION-${{ matrix.target }}"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $dist  = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force $stage, $dist | Out-Null
          Copy-Item target/release/mzpeak-convert.exe, LICENSE, README.md, THIRD-PARTY-NOTICES.md $stage
          # The converter looks for each glue under glue\<name>\ beside the exe when its MZPC_*_GLUE
          # variable is unset, so this layout is the contract, not a convenience.
          $glue = [ordered]@{
            sciex         = 'glue/sciex/bin/Release/net8.0'
            shimadzu      = 'glue/shimadzu/bin/Release/net8.0'
            agilent       = 'glue/agilent/bin/Release/net48'
            agilent_midac = 'glue/agilent_midac/bin/Release/net8.0'
          }
          foreach ($k in $glue.Keys) {
            $d = Join-Path $stage "glue/$k"
            New-Item -ItemType Directory -Force $d | Out-Null
            Get-ChildItem $glue[$k] -File | Where-Object Extension -ne '.pdb' | Copy-Item -Destination $d
          }
          $zip = Join-Path $dist "$name.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $name.zip`n")
          "STAGE=$stage" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "### ${{ matrix.target }}`n``````n$hash  $name.zip`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Verify
        run: |
          $exe = Join-Path $env:STAGE 'mzpeak-convert.exe'
          # The PE machine field, so an x64 build can never ship under the arm64 name or back.
          $b = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Output ("PE machine 0x{0:X4}" -f $machine)
          if ($machine -ne ${{ matrix.machine }}) { Write-Output "::error::expected machine ${{ matrix.machine }}"; exit 1 }

          $need = 'LICENSE', 'THIRD-PARTY-NOTICES.md',
                  'glue/sciex/SciexGlue.dll', 'glue/sciex/SciexGlue.runtimeconfig.json',
                  'glue/shimadzu/ShimadzuGlue.dll', 'glue/shimadzu/ShimadzuGlue.runtimeconfig.json',
                  'glue/agilent/AgilentGlueHost.exe',
                  'glue/agilent_midac/AgilentMidacGlue.dll', 'glue/agilent_midac/AgilentMidacGlue.runtimeconfig.json'
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $env:STAGE $_)) }
          if ($missing) { Write-Output "::error::archive lacks: $($missing -join ', ')"; exit 1 }

          # Shimadzu.LabSolutions.IO 5.0 deserialises through BinaryFormatter, which .NET disables
          # unless the generated runtimeconfig says otherwise — without it every .lcd looks unreadable.
          $cfg = Get-Content (Join-Path $env:STAGE 'glue/shimadzu/ShimadzuGlue.runtimeconfig.json') -Raw | ConvertFrom-Json
          if ($cfg.runtimeOptions.configProperties.'System.Runtime.Serialization.EnableUnsafeBinaryFormatterSerialization' -ne $true) {
            Write-Output "::error::ShimadzuGlue.runtimeconfig.json does not enable BinaryFormatter"; exit 1
          }

          # With no arguments the Agilent host prints its usage and exits 2: proof the exe boots on
          # this image (under x64 emulation on the arm64 runner). Start-Process, not `& exe 2>&1`,
          # whose $LASTEXITCODE ended this check with exit 1 and no diagnostic on pwsh 7.6.
          $p = Start-Process -FilePath (Join-Path $env:STAGE 'glue/agilent/AgilentGlueHost.exe') -NoNewWindow -Wait -PassThru
          Write-Output "AgilentGlueHost.exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 2) { Write-Output "::error::AgilentGlueHost.exe exited $($p.ExitCode), expected 2"; exit 1 }

          $zip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'dist') -Filter *.zip | Select-Object -First 1
          $want = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() -ne $want) { Write-Output "::error::sidecar mismatch"; exit 1 }

          $have = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $have -ne "mzpeak-convert $env:VERSION") { Write-Output "::error::--version says '$have', expected mzpeak-convert $env:VERSION"; exit 1 }
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke.mzpeak'
          & $exe tests/fixtures/tiny.pwiz.1.1.mzML -o $smoke --force
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smoke) -or (Get-Item $smoke).Length -eq 0) { Write-Output "::error::smoke conversion failed"; exit 1 }
          # Read the archive back, so one that is written but unreadable fails here: the inspection
          # report and the mzML export must both hold every spectrum of the source.
          $n = [regex]::Match((Get-Content tests/fixtures/tiny.pwiz.1.1.mzML -Raw), '<spectrumList count="(\d+)"').Groups[1].Value
          $report = & $exe $smoke
          if ($LASTEXITCODE -ne 0 -or -not ($report -match ('^spectra:\s+{0}$' -f $n))) { Write-Output "::error::inspecting smoke.mzpeak does not count $n spectra"; $report; exit 1 }
          $mzml = Join-Path $env:RUNNER_TEMP 'smoke.mzML'
          & $exe $smoke -o $mzml --force
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::exporting smoke.mzpeak to mzML failed"; exit 1 }
          $m = [regex]::Matches((Get-Content $mzml -Raw), '<spectrum ').Count
          if ($m -ne [int]$n) { Write-Output "::error::smoke.mzML holds $m spectra, the source $n"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  # What the binaries link, from the same Cargo.lock the platform jobs build with. Generated per
  # release rather than tracked: the tracked sbom.cdx.json still described 0.1.0 at 0.11.5.
  sbom:
    name: SBOM
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate the CycloneDX SBOM from Cargo.lock
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG carries version ${TAG#v} but Cargo.toml says $version"
            exit 1
          fi
          dist="$RUNNER_TEMP/dist"
          sbom="mzpeak-convert-$version.cdx.json"
          mkdir -p "$dist"
          cargo metadata --format-version 1 --all-features --locked | python3 tools/gen_sbom.py > "$dist/$sbom"
          # `$v` is jq's variable, not the shell's.
          # shellcheck disable=SC2016
          jq -e --arg v "$version" '.metadata.component.version == $v' "$dist/$sbom" > /dev/null \
            || { echo "::error::$sbom does not describe mzpeak-convert $version"; exit 1; }
          ( cd "$dist" && sha256sum "$sbom" > "$sbom.sha256" )
          { echo "### SBOM"; jq -r '"\(.components | length) dependency components"' "$dist/$sbom"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  # One place attaches everything, so the platform jobs no longer race to create the release, and a
  # platform that failed does not hold back the ones that built — the run still goes red for it.
  publish:
    name: Attach to the release
    needs: [ci, macos, linux, windows, sbom]
    if: ${{ always() && needs.ci.result == 'success' && !cancelled() && github.event_name != 'pull_request' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check every sidecar, then attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          archives=(dist/*.tar.gz dist/*.zip)
          [ ${#archives[@]} -gt 0 ] || { echo "::error::no platform produced an archive"; exit 1; }
          # Hashes written on three operating systems, checked on a fourth.
          ( cd dist && sha256sum -c ./*.sha256 )
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          { echo "### attached to $TAG"; ls -l dist | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"

  cask:
    name: Update the Homebrew tap
    needs: [macos, publish]
    if: ${{ always() && needs.macos.result == 'success' && needs.publish.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # A dispatch that backfills an OLDER tag must not walk the tap backwards.
      - name: Only the newest release owns the tap
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "latest release is $latest, not $TAG — leaving the tap alone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the cask at this release
        if: steps.guard.outputs.skip != 'true'
        run: tools/update_homebrew.sh "$TAG"

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/mzpeak-convert.rb; then
            echo "cask already current"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mzpeak-convert.rb
          git commit -m "homebrew: mzpeak-convert $TAG [skip ci]"
          git push || {
            echo "::error::could not push the cask update (protected branch?). Run" \
                 "\`tools/update_homebrew.sh $TAG\` locally and commit the file it changes."
            exit 1
          }
